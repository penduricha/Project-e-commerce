        // Kết quả sẽ là true
        class Person {
            constructor(firstName, age) {
                this.firstName = firstName;
                this.age = age;
            }
        }

        const personA = new Person('Tom', 10);
        const personB = new Person('Tom', 10);
        const personC = personA;
        // Tham chiếu tới cùng một đối tượng

        console.log(JSON.stringify(personA) === JSON.stringify(personB));
        // Kết quả: false
        console.log(personA === personC);
        // Kết quả: true
    </script>
